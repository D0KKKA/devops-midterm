name: kukurekin-danil-student-api

services:
  app:
    build:
      context: .
    image: kukurekin-danil-student-api:v1.0-37554
    container_name: kukurekin-danil-student-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: student_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-network

  db:
    image: postgres:16-alpine
    container_name: kukurekin-danil-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-network

volumes:
  postgres_data:

networks:
  student-network:
    name: kukurekin-danil-network
